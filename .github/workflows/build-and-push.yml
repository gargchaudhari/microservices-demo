name: Build and Push to GCP Artifact Registry

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  GAR_LOCATION: us-central1
  REPOSITORY: online-boutique

permissions:
  contents: 'read'
  id-token: 'write'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: adservice
            context: src/adservice
          - service: cartservice
            context: src/cartservice/src
          - service: checkoutservice
            context: src/checkoutservice
          - service: currencyservice
            context: src/currencyservice
          - service: emailservice
            context: src/emailservice
          - service: frontend
            context: src/frontend
          - service: loadgenerator
            context: src/loadgenerator
          - service: paymentservice
            context: src/paymentservice
          - service: productcatalogservice
            context: src/productcatalogservice
          - service: recommendationservice
            context: src/recommendationservice
          - service: shippingservice
            context: src/shippingservice

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/1056131792984/locations/global/workloadIdentityPools/github-pool/providers/github-provider-v2'
          service_account: github-actions-pusher@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com
          token_format: 'access_token'

      - name: Login to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GAR_LOCATION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ matrix.service }}:latest
